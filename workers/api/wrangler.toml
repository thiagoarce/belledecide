name = "belledecide-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "anthropic" | "gemini" — ver src/lib/llm/provider.ts
LLM_PROVIDER = "gemini"
# Precisa bater com o provedor acima (ex: "gemini-flash-latest" ou
# "claude-opus-4-8"). Usamos o alias "-latest" do Gemini de propósito —
# o Google descontinua versões específicas (ex: gemini-2.0-flash,
# gemini-2.5-flash) para novos usuários periodicamente; o alias sempre
# resolve para o Flash atual. Veja https://ai.google.dev/gemini-api/docs/models
LLM_MODEL = "gemini-flash-latest"
ALLOWED_ORIGIN = "https://belledecide.pages.dev"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   GEMINI_API_KEY      (necessário se LLM_PROVIDER = "gemini")
#   ANTHROPIC_API_KEY   (necessário se LLM_PROVIDER = "anthropic")
